spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    from: ${SPRING_MAIL_FROM}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY}

ai:
  openai:
    api-key: ${AI_OPENAI_API_KEY}

oauth2:
  kakao:
    client-id: ${OAUTH2_KAKAO_CLIENT_ID}
    client-secret: ${OAUTH2_KAKAO_CLIENT_SECRET:}
    redirect-uri: ${OAUTH2_KAKAO_REDIRECT_URI}
  google:
    client-id: ${OAUTH2_GOOGLE_CLIENT_ID}

toss:
  payments:
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}

cloud:
  aws:
    s3:
      bucket: ${CLOUD_AWS_S3_BUCKET}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false